# The API's scheduled jobs. FastAPI Cloud has no scheduler and scales to zero when idle, so GitHub
# runs them against the production database. GitHub's shortest schedule is every 5 minutes and
# runs can start a few minutes late: attendance alerts reach parents within about 15 minutes of
# the cut-off. Every job is safe to run again (idempotent). Secrets: see docs/deployment.md.
name: Scheduled jobs

on:
  schedule:
    - cron: "*/5 * * * *"   # attendance cut-off and queued emails
    - cron: "15 1 * * *"     # daily, 01:15 UTC: platform billing and file clean-up
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run now"
        type: choice
        options: [frequent, daily, all]
        default: all

concurrency:
  group: scheduled-jobs-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

jobs:
  run:
    # Only on the main repository's default branch, never on forks
    if: github.repository == 'Yennego/sms'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./Backend/sms-backend
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      SECRET_KEY: ${{ secrets.PROD_SECRET_KEY }}
      ATTENDANCE_QR_SECRET: ${{ secrets.PROD_ATTENDANCE_QR_SECRET }}
      APP_BASE_URL: ${{ secrets.PROD_APP_BASE_URL }}
      SMTP_SERVER: ${{ secrets.PROD_SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.PROD_SMTP_PORT }}
      SENDER_EMAIL: ${{ secrets.PROD_SENDER_EMAIL }}
      SENDER_PASSWORD: ${{ secrets.PROD_SENDER_PASSWORD }}
      EMAIL_FROM_NAME: ${{ secrets.PROD_EMAIL_FROM_NAME }}
      FILE_STORAGE: s3
      S3_ENDPOINT_URL: ${{ secrets.PROD_S3_ENDPOINT_URL }}
      S3_BUCKET: ${{ secrets.PROD_S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.PROD_S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.PROD_S3_SECRET_ACCESS_KEY }}
      S3_REGION: auto
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen --no-dev

      - name: Close attendance days (cut-off passed)
        if: github.event.schedule == '*/5 * * * *' || inputs.job == 'frequent' || inputs.job == 'all'
        run: uv run --frozen --no-dev python -m scripts.close_attendance_days
      - name: Send queued notifications
        if: always() && (github.event.schedule == '*/5 * * * *' || inputs.job == 'frequent' || inputs.job == 'all')
        run: uv run --frozen --no-dev python -m scripts.send_notifications

      - name: Platform billing
        if: github.event.schedule == '15 1 * * *' || inputs.job == 'daily' || inputs.job == 'all'
        run: uv run --frozen --no-dev python -m scripts.run_platform_billing
      - name: Clean up unused files
        if: always() && (github.event.schedule == '15 1 * * *' || inputs.job == 'daily' || inputs.job == 'all')
        run: uv run --frozen --no-dev python -m scripts.cleanup_files
